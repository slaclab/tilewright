# groups: one HDF5 group per entity inside a file.
#
#   /abs/path/to/grouped/samples.h5
#   └── /samples/
#       ├── sample_000/
#       │   ├── spectrum      (151, 40)   → artifact; `dataset` is relative to the entity group
#       │   ├── energy        (151,)      → a copy per sample; shared axis if they all agree
#       │   └── params/
#       │       ├── tenDq     ()          → parameter
#       │       └── F2_dd     ()
#       ├── sample_001/ ...
#
# Expected: entities = subgroups of /samples over all files, artifacts = entities × 1.

label: Example Groups
key: EXAMPLE_GROUPS

metadata:
  method: [RIXS]
  data_type: simulation
  material: NiPS3
  producer: edrixs
  project: MAIQMag

source:
  groups:
    directory: /abs/path/to/grouped
    pattern: "*.h5"
    entity_group: /samples           # omit to treat each file's top-level groups as entities
    params: {group: params}          # relative to each entity group
    # Entities two levels down, with values beside them. For files laid out as
    #   /<site>/<detector>/spectrum        → one entity per site × detector
    #   /<site>/calibration/gain  ()       → a parameter of every detector of that site
    # replace entity_group and params with:
    #   entity_group: "/*"
    #   exclude_groups: [calibration]
    #   params: {groups: {calibration: ../calibration}, location: ':/(?P<site>[^/]+)/(?P<detector>[^/]+)$'}
    # Expected: entities = detector groups summed over sites.
    # The location names keep two detectors of one site apart, since both read the same gain.
    #
    # One value per entity in an array beside the entity groups. For files laid out as
    #   /run/scan_01/spectrum ... /run/scan_12/spectrum   → one entity per scan
    #   /run/beam_current  (12,)   → element i belongs to the i-th scan in sorted name order
    # replace entity_group and params with:
    #   entity_group: /run
    #   params: {group: ..}
    # Expected: entities = scan groups. Names sort as text: scan_10 comes before scan_2,
    # so number them with leading zeros.

artifacts:
  - {type: spectrum, dataset: spectrum}

# An axis every sample holds its own copy of. The path is absolute, so it names one of
# those copies; `tilewright manifest` checks the copy in every other entity group, in
# every file, against it, and refuses the dataset when two differ — an energy that varies
# per sample is an artifact, not a shared axis. A path beside the entity groups
# (/samples/energy) is one copy per file instead. Uncomment for a layout that holds it:
# shared:
#   - {type: energy, dataset: /samples/sample_000/energy}
