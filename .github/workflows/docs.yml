name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "skills/**"
      - "includes/**"
      - "mkdocs.yml"
      - "src/tilewright/contract.py"
      - "scripts/build_yaml_reference.py"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "skills/**"
      - "includes/**"
      - "mkdocs.yml"
      - "src/tilewright/contract.py"
      - "scripts/build_yaml_reference.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Let an in-flight publish finish rather than killing it mid-deploy; two merges in
# quick succession queue instead of racing to be last writer.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0

      - name: The YAML reference must match the contract models
        run: uv run scripts/build_yaml_reference.py --check

      - name: Build the site
        run: uv run --no-project --with 'mkdocs-material>=9,<10' mkdocs build --strict

      # What upload-pages-artifact does, inlined: that action is a composite whose
      # inner upload-artifact is tag-pinned, which the organisation's SHA-only policy
      # rejects. deploy-pages wants one artifact named github-pages holding artifact.tar.
      - name: Pack the site for Pages
        run: tar --dereference --hard-dereference --directory site -cf "$RUNNER_TEMP/artifact.tar" .

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  # Publishing only happens on main; a pull request gets the build check alone.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
