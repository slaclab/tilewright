[project]
name = "tilewright"
version = "0.2.0"
description = "Register multi-entity scientific HDF5 datasets into a Tiled catalog from one YAML contract."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "h5py",
    "numpy",
    "ruamel.yaml",
    "pydantic>=2",
    "tiled[server]",
]

[project.optional-dependencies]
test = [
    "pytest",
]

[project.scripts]
tilewright = "tilewright.cli:main"

[project.urls]
Repository = "https://github.com/slaclab/TileWright"
Documentation = "https://slaclab.github.io/TileWright/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tilewright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Server-dependent tests are opt-in: `pytest -m integration` with TILED_URL and
# TILED_API_KEY set. A bare `pytest` runs offline.
addopts = "-m 'not integration'"
markers = [
    "integration: needs a running Tiled server with data registered",
]
