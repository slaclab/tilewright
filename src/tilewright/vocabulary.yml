# The vocabulary: canonical ids for the dataset-level facets, and the aliases people type.
#
# An id is what discovery keys on: Key("material") == "NiPS3" finds every dataset whose
# author wrote NiPS3, NIPS or nips3, because the aliases are rewritten to the id before
# registration. An alias may `imply` other fields (EDRIXS is RIXS, simulated).
#
# Values not listed here register as written, with a warning. To add one: edit this file
# in a pull request (see CONTRIBUTING.md, "Adding a vocabulary term"); the vocab-review
# skill and scripts/vocab_report.py show what is off-list on a live server.
#
# Which *fields* exist is defined once, in contract.py — not here.

methods:
  - id: INS
    label: Inelastic Neutron Scattering
  - id: RIXS
    label: Resonant Inelastic X-ray Scattering
    aliases:
      - id: EDRIXS
        implies: {data_type: simulation}
  - id: Diffraction
    label: Diffraction
    aliases: [TOF_Laue_Diffraction, PowderDiffraction, XRD]
  - id: TotalScattering
    label: Total Scattering
    aliases: [NeutronTotalScattering]
  - id: STEM
    label: Scanning Transmission Electron Microscopy
    aliases: [HRSTEM]
  - id: Magnetization
    label: Magnetization Curves
  - id: VDP
    label: Virtual Diffraction Pattern
  - id: XPS
    label: X-ray Photoelectron Spectroscopy
  - id: XES
    label: X-ray Emission Spectroscopy
  - id: SWT
    label: Spin Wave Theory

materials:
  - id: NiPS3
    label: Nickel phosphorus trisulfide
    aliases: [NIPS, nips3, NiPS_3]
  - id: NiO
    label: Nickel oxide
  - id: CrSBr
    label: Chromium sulfide bromide
  - id: YbBi2IO4
    label: Ytterbium bismuth iodate
  - id: LaB6
    label: Lanthanum hexaboride (diffraction standard)
  - id: Ni(NCS)2(pyzdo)2
    label: Nickel thiocyanate pyrazine dioxide
  - id: Mn2-xFexO3
    label: Iron-substituted bixbyite
  - id: generic_spin_model
    label: Generic spin model, no specific material
  - id: not_applicable
    label: No material (benchmarks, model weights)
    aliases: [none, n/a, N/A]

data_types:
  - id: simulation
  - id: experimental
  - id: benchmark
  - id: optimization

projects:
  - id: MAIQMag
    label: Multimodal AI for 2D Quantum Magnets
  - id: ILLUMINE

# Beamtime proposals. Any id in the facility's own format is fine; list the ones we key on.
proposals:
  - id: IPTS-37598
  - id: IPTS-21374
  - id: IPTS-12132

facilities:
  - id: LCLS
    label: Linac Coherent Light Source (SLAC)
  - id: SSRL
    label: Stanford Synchrotron Radiation Lightsource (SLAC)
  - id: SNS
    label: Spallation Neutron Source (ORNL)
  - id: HFIR
    label: High Flux Isotope Reactor (ORNL)
  - id: CNMS
    label: Center for Nanophase Materials Sciences (ORNL)
    aliases: [Advanced Microscopy Laboratory]
  - id: NSLS-II
    label: National Synchrotron Light Source II (BNL)
  - id: APS
    label: Advanced Photon Source (ANL)

# Code that produced or reduced the data: the pipeline, not its dependencies.
producers:
  - id: sunny_jl
    label: Sunny.jl
    repo: https://github.com/SunnySuite/Sunny.jl
    aliases: [Sunny.jl, sunny]
  - id: lajer2025Hamiltonian
    repo: https://github.com/mpmdean/lajer2025Hamiltonian
  - id: edrixs
    repo: https://github.com/NSLS-II/edrixs
  - id: mantid
    label: Mantid
    repo: https://github.com/mantidproject/mantid
    aliases: [Mantid]
  - id: psana
    label: LCLS psana
    aliases: [PSANA]
  - id: pytorch
    aliases: [PyTorch, torch]
